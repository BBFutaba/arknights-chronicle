# 人工维护的实体规则和补充。每次运行 `python -m pipeline.build` 都会读取这个文件。
# 改完重新构建即可，vault 里的笔记会跟着更新。

# ---------------------------------------------------------------------------
# 说话人别名 → 标准人物名
# 异格干员（如「耀骑士临光」）会自动并入本体，这里只需要写其余情况，
# 比如本名、带头衔的写法。`python -m pipeline.check` 会列出疑似需要合并的说话人。
# ---------------------------------------------------------------------------
[aliases]
"玛嘉烈" = "临光"
"审判官艾丽妮" = "艾丽妮"
"林雨霞" = "林"

# ---------------------------------------------------------------------------
# 说话人过滤：路人、群体和未知身份不建人物页，只在分集笔记里显示台词数
# ---------------------------------------------------------------------------
[speakers]
# 直接忽略的说话人名
ignore = ["？？？", "???", "？", "……", "众人", "所有人", "广播", "通讯"]
# 以这些词结尾的说话人视为路人（如「整合运动成员」「维多利亚士兵」）
generic_suffixes = [
  "声音", "成员", "士兵", "战士", "佣兵", "雇佣兵", "卫兵", "守卫", "队员", "人员", "干员",
  "军官", "军人", "官员", "警察", "警员", "修士", "教徒", "信使", "记者",
  "居民", "村民", "镇民", "市民", "岛民", "平民", "民众", "群众", "路人", "游客", "观众",
  "工人", "矿工", "商人", "船员", "员工", "研究员", "学生", "学徒", "猎人",
  "男人", "女人", "男性", "女性", "男子", "女子", "青年", "少年", "少女", "女孩", "男孩",
  "孩子", "小孩", "老人", "感染者", "贵族", "生物", "的人",
]
# 命中上面规则、但其实是具名人物的说话人，写在这里强制建页
keep = []

# 「博士」的写法；剧本里的选项（Decision）也算博士的台词
doctor = ["博士"]

# ---------------------------------------------------------------------------
# 年表事件里的人物识别
# 单个汉字的名字默认不参与匹配（太容易误配）。列在这里的会参与匹配，
# 值是要排除的常用词：字出现在这些词里时不算这个人物。
# ---------------------------------------------------------------------------
[linker.single_char]
"陈" = ["陈述", "陈列", "陈旧", "陈设", "陈腐", "陈词", "陈年", "陈情", "陈规", "新陈代谢"]
"煌" = ["辉煌", "煌煌"]
"夕" = ["夕阳", "朝夕", "七夕", "除夕", "旦夕", "夕照"]
"黍" = ["黍米", "禾黍"]

# ---------------------------------------------------------------------------
# 地区与势力
# 国家和组织列表来自 handbook_team_table（罗德岛、乌萨斯、龙门近卫局……），
# 这里补充数据表里没有的，以及用于「提及」匹配的其他写法。
# ---------------------------------------------------------------------------
[mentions]
# 一集里至少提到几次才记为「提及」
min_count = 2
# 额外的匹配写法：标准名 = [其他写法]。单字的名字（炎、东）不会直接匹配，需要在这里给出写法。
[mentions.match]
"炎" = ["炎国"]
"东" = ["东国"]

[[regions]]
name = "卡兹戴尔"

[[regions]]
name = "切尔诺伯格"
parent = "乌萨斯"

[[regions]]
name = "伦蒂尼姆"
parent = "维多利亚"

[[factions]]
name = "整合运动"
